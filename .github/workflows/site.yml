name: Build, update and deploy Cookie Lab
on:
  push:
    branches: [main]
    paths: ['dist/**', '.github/workflows/site.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
permissions:
  contents: read
concurrency:
  group: cookie-lab-pages
  cancel-in-progress: false
jobs:
  update:
    if: github.event_name != 'push' && vars.ENABLE_VIDEO_UPDATES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Read new channel videos
        id: extract
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
        run: python scripts/update_videos.py --max-videos 3
      - name: Preserve successful updates and retry state
        run: |
          git config user.name 'cookie-lab-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/data/generated.json data/video-state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update grounded video references and checkpoint'
            git push
          fi
      - name: Report incomplete extraction
        if: steps.extract.outcome == 'failure'
        run: echo 'Some video analysis failed. Checkpoint was retained for next run.' >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: update
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: node --test tests/logic.test.mjs
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
